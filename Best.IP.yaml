proxy-providers:
  Google:
    type: http
    url: "https://git.ddxm.pp.ua/gist.githubusercontent.com/gentle95/0286c98ea86e1e7f34050b023bdb918c/raw/Vless"
    path: ./googlevless.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  FreeOnline:
    type: http
    url: "https://git.ddxm.pp.ua/gist.githubusercontent.com/gentle95/d03f3566f71e77c14f292f66013002e0/raw/all.yaml"
    path: ./freeonline.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: 🔰 节点选择
    type: select
    proxies:
      - 🌊 全部节点
      - 🚀 故障转移
      - ♻️ Google_Cloud
      - 🌈 FreeOnline
      - 💦 手动切换
      - 🎯 全球直连
  - name: 🌊 全部节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - Google
      - FreeOnline
  - name: ♻️ Google_Cloud
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - Google
  - name: 🌈 FreeOnline
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FreeOnline
  - name: 🚀 故障转移
    type: fallback
    proxies:
      - ♻️ Google_Cloud
      - 🌈 FreeOnline
  - name: 💦 手动切换
    type: select
    proxies:
      - 🎯 全球直连
    use:
      - Google
      - FreeOnline
  - name: ♨ Hot
    type: select
    proxies:
      - 💦 手动切换
      - 🔰 节点选择
      - ♻️ Google_Cloud
      - 🌈 FreeOnline
      - 🎯 全球直连
  - name: 🌏 国内媒体
    type: select
    proxies:
      - 🎯 全球直连
      - 🔰 节点选择
      - 💦 手动切换
