      - 🔰 节点选择
      - 🐳 手动切换
  - name: 🧿 Cloudflare优先
    type: fallback
    proxies:
      - 🍁 CF_BPB
      - 🇺🇸 美国节点
      - 🏳️‍🌈 其它节点
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: 🧿 🇭🇰香港优先️
    type: fallback
    proxies:
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点
      - 🏳️‍🌈 其它节点
      - 🍁 CF_BPB
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: 🧿 🇺🇸美国优先️
    type: fallback
    proxies:
      - 🇺🇸 美国节点
      - 🏳️‍🌈 其它节点
      - 🍁 CF_BPB
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: 🇭🇰 香港节点
    include-all: true
    filter: (?i)港|HK|hk|Hong Kong|HongKong|hongkong
    type: url-test
    interval: 300
  - name: 🇯🇵 日本节点
    include-all: true
    filter: (?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan
    type: url-test
    interval: 300
  - name: 🇺🇸 美国节点
    include-all: true
    filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States
    type: url-test
    interval: 300
  - name: 🇹🇼 台湾节点
