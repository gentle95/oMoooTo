external-controller: 0.0.0.0:9090
secret: "zrszyx"
external-ui: ui
external-ui-name: meta
external-ui-url: "https://git.ddxm.pp.ua/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
proxy-providers:
  FreeOnline:
    type: http
    url: "https://git.ddxm.pp.ua/gist.githubusercontent.com/gentle95/d03f3566f71e77c14f292f66013002e0/raw/all.yaml"
    path: ./proxy/freeonline.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  CF_BPB:
    type: http
    url: "https://ooo.ddxm.pp.ua/sub/normal/ce8b5bb9-bff8-41bb-977b-19d2f58c089d#%F0%9F%92%A6%20BPB%20Normal"
    path: ./proxy/CF_BPB.yaml
    interval: 21600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: 🔰 节点选择
    type: select
    proxies:
      - ♾️ 故障转移
      - 🍀 自动切换
      - 🍁 CF_BPB
      - 🐳 手动切换
      - 🎯 全球直连
  - name: 🐳 手动切换
    type: select
    proxies:
      - 🎯 全球直连
      - 🍁 CF_BPB
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点
      - 🏳️‍🌈 其它节点
    use:
      - CF_BPB
      - FreeOnline
  - name: 🍀 自动切换
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - CF_BPB
      - FreeOnline
  - name: ㊙️ HOT
    type: select
    proxies:
      - 🐳 手动切换
      - 🔰 节点选择
      - 🎯 全球直连
  - name: 🍁 CF_BPB
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - CF_BPB
  - name: 🍂 FreeOnline
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FreeOnline
  - name: ♾️ 故障转移
    type: fallback
    proxies:
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点
      - 🍁 CF_BPB
      - 🏳️‍🌈 其它节点
    url: http://www.gstatic.com/generate_204
    interval: 300
  - name: 🇭🇰 香港节点
    include-all: true
    filter: (?i)港|HK|hk|Hong Kong|HongKong|hongkong
    type: url-test
    interval: 300
  - name: 🇯🇵 日本节点
    include-all: true
    filter: (?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan
    type: url-test
    interval: 300
  - name: 🇺🇸 美国节点
    include-all: true
    filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States
    type: url-test
    interval: 300
  - name: 🇹🇼 台湾节点
    include-all: true
    filter: (?i)台|新北|彰化|TW|Taiwan
    type: url-test
    interval: 300
  - name: 🇸🇬 狮城节点
    include-all: true
    filter: (?i)新加坡|坡|狮城|SG|Singapore
    type: url-test
    interval: 300
  - name: 🏳️‍🌈 其它节点
    use:
      - FreeOnline
    exclude-filter: (?i)新加坡|坡|狮城|SG|Singapore|港|HK|hk|Hong Kong|HongKong|hongkong|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|台|新北|彰化|TW|Taiwan|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan
    type: url-test
    interval: 300
  - name: 🌏 国内媒体
    type: select
    proxies:
      - 🎯 全球直连
      - 🔰 节点选择
      - 🐳 手动切换
  - name: 🌎 国外媒体
