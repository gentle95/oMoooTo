external-controller: 0.0.0.0:9090
secret: zrszyx
external-ui: "/docker/mihomo/data/ui"
external-ui-name: meta
external-ui-url: "https://git.ddxm.pp.ua/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

dns:
  enable: true
  ipv6: true
  # listen: 0.0.0.0:1053
  # 路由器个人建议使用 redir-host 以最佳兼容性
  # 其他设备可以使用 fake-ip
  enhanced-mode: redir-host
  respect-rules: true
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - '*'
    - '+.lan'
    - '+.local'
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - '[2402:4e00:0::2a51:af85]'
    - '[2400:3200::1]'
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  proxy-server-nameserver:
    - https://doh.pub/dns-query

mixed-port: 7890
socks-port: 7891
redir-port: 7892
port: 7893
tproxy-port: 7894
mode: rule
log-level: warning
allow-lan: true
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 15
ipv6: true
tcp-concurrent: true
unified-delay: true
authentication:
  - "zou:chenli5"
skip-auth-prefixes:
  - 127.0.0.1/8
  - 192.168.1.0/24
  - ::1/128

sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "+.apple.com"
    - Mijia Cloud
    - dlg.io.mi.com
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"

tun:
  enable: false  # enable 'true'
  stack: system  # or 'gvisor'
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geodata-loader: standard
geox-url:
  geosite: https://git.ddxm.pp.ua/github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://git.ddxm.pp.ua/github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb
  geoip: https://git.ddxm.pp.ua/github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
geo-auto-update: true
geo-update-interval: 24

proxy-providers:
  FreeOnline:
    type: http
    url: https://home.ddx2013.cc:58299/download/sub?target=ClashMeta
    path: "./proxy_provider/freeonline.yaml"
    interval: 7200
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
  CF_BPB:
