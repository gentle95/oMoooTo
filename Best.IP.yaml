    url: https://ooo.ddxm.pp.ua/sub/normal/ce8b5bb9-bff8-41bb-977b-19d2f58c089d?app=clash#%F0%9F%92%A6%20BPB%20Normal
    path: "./proxy_provider/CF_BPB.yaml"
    interval: 7200
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
  Hold:
    type: http
    url: https://home.ddx2013.cc:53001/Xvn47M4QzvZXgn65/download/hold?target=ClashMeta
    path: "./proxy_provider/Hold.yaml"
    interval: 7200
    health-check:
