      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点
      - 🏳️‍🌈 其它节点
    include-all: true
  - name: 🍁 CF_BPB
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - CF_BPB
  - name: 🍂 FreeOnline
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - FreeOnline
